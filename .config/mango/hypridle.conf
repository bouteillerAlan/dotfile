# Idle policy for Mango. Use the same Miel launcher as the manual lock bind.
# The launcher prevents duplicate requests; this does not confirm lock readiness.

general {
    lock_cmd = /home/a2n/.config/miel/gtklock/lock.sh
    before_sleep_cmd = /home/a2n/.config/miel/gtklock/lock.sh
}

# Lock the current session after 5 minutes without input.
listener {
    timeout = 300
    on-timeout = /home/a2n/.config/miel/gtklock/lock.sh
}

# Suspend after 30 minutes without input.  Activity resumes the idle timer.
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
