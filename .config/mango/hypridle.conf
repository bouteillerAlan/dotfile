# Idle policy for Mango.  Use the same gtklock style as the Mango lock bind.
# pidof prevents another gtklock instance from being started while locked.

general {
    lock_cmd = pidof gtklock || gtklock --style /home/a2n/.config/miel/gtklock/style.css
    before_sleep_cmd = pidof gtklock || gtklock --style /home/a2n/.config/miel/gtklock/style.css
}

# Lock the current session after 5 minutes without input.
listener {
    timeout = 300
    on-timeout = pidof gtklock || gtklock --style /home/a2n/.config/miel/gtklock/style.css
}

# Suspend after 30 minutes without input.  Activity resumes the idle timer.
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
