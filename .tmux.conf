set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin "janoamaral/tokyo-night-tmux"

# set -g @tokyo-night-tmux_theme night
set -g @tokyo-night-tmux_theme moon   # night | storm | moon | day
set -g @tokyo-night-tmux_transparent 1 # transparent background

# start index from 1 and not from 0
set -g base-index 1

# vi/nvim-like copy mode
setw -g mode-keys vi

# reload conf
unbind r
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# pan navigation (in place of ctrl+b+arrow)
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# visual/yank
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel
bind-key -T copy-mode-vi C-v send -X rectangle-toggle

# line motions
bind-key -T copy-mode-vi 0 send -X start-of-line
bind-key -T copy-mode-vi ^ send -X back-to-indentation
bind-key -T copy-mode-vi '$' send -X end-of-line

# file/buffer motions
bind-key -T copy-mode-vi g send -X top-line
bind-key -T copy-mode-vi G send -X bottom-line

# search
bind-key -T copy-mode-vi / send -X search-forward
bind-key -T copy-mode-vi ? send -X search-backward
bind-key -T copy-mode-vi n send -X search-again
bind-key -T copy-mode-vi N send -X search-reverse

# form
# ◢ ◣ ◤ ◥

# color just for reference
set -g @tokyo_bg "#1a1b26"
set -g @tokyo_bg_dark "#16161e"
set -g @tokyo_fg "#c0caf5"
set -g @tokyo_black "#414868"
set -g @tokyo_comment "#565f89"
set -g @tokyo_blue "#7aa2f7"
set -g @tokyo_cyan "#7dcfff"
set -g @tokyo_green "#9ece6a"
set -g @tokyo_magenta "#bb9af7"
set -g @tokyo_orange "#ff9e64"
set -g @tokyo_red "#f7768e"
set -g @tokyo_yellow "#e0af68"
set -g @tokyo_purple "#9d7cd8"
set -g @tokyo_teal "#73daca"

set -g status on
set -g status-interval 1
set -g status-justify left

set -g status-style "bg=#1a1b26,fg=#c0caf5"
set -g status-left-length 100
set -g status-right-length 100

# Colors (edit these once, they're used everywhere below)
set -g @color-1 "#1a1b26"   # base background
set -g @color-2 "#9ece6a"   # status-left / session name
set -g @color-3 "#565f89"   # inactive window bg
set -g @color-4 "#c0caf5"   # inactive window text
set -g @color-5 "#e0af68"   # active window / hostname
set -g @color-6 "#ff9e64"   # time
set -g @color-7 "#f7768e"   # date

# set -g @color-1 "#1a1b26"   # base background
# set -g @color-2 "#9ece6a"   # status-left / session name
# set -g @color-3 "#394d23"   # inactive window bg
# set -g @color-4 "#67913b"   # inactive window text
# set -g @color-5 "#67913b"   # active window / hostname
# set -g @color-6 "#81b946"   # time
# set -g @color-7 "#9ece6a"   # date
#
# set -g @green-1 "#9ece6a"
# set -g @green-2 "#81b946"
# set -g @green-3 "#67913b"
# set -g @green-4 "#4e6b2e"
# set -g @green-5 "#394d23"
# set -g @green-6 "#273419"
# set -g @green-7 "#171e10"

set -g status-left \
"#[fg=#{@color-1},bg=#{@color-2},bold] #S \
#[fg=#{@color-2},bg=#{@color-1}]◣"

# avoid to add another space beetwen each window
set -g window-status-separator ""
# Inactive windows
setw -g window-status-format \
"#[fg=#{@color-3},bg=#{@color-1}]◥\
#[fg=#{@color-4},bg=#{@color-3}] #I:#W \
#[fg=#{@color-3},bg=#{@color-1}]◣"

# Active window
setw -g window-status-current-format \
"#[fg=#{@color-2},bg=#{@color-1}]◥\
#[fg=#{@color-1},bg=#{@color-2},bold] #I:#W \
#[fg=#{@color-2},bg=#{@color-1}]◣"

# Right: hostname + time/date
set -g status-right \
"#[fg=#{@color-5},bg=#{@color-1}]◢\
#[fg=#{@color-1},bg=#{@color-5},bold] #h \
#[fg=#{@color-6},bg=#{@color-5}]◢\
#[fg=#{@color-1},bg=#{@color-6},bold] %H:%M \
#[fg=#{@color-6},bg=#{@color-1}]\
#[fg=#{@color-7},bg=#{@color-6}]◢\
#[fg=#{@color-1},bg=#{@color-7},bold] %d-%b \
#[fg=#{@color-7},bg=#{@color-1}]"

# Pane colors
set -g pane-border-style "fg=#292e42"
set -g pane-active-border-style "fg=#7aa2f7"

# Messages
set -g message-style "bg=#7aa2f7,fg=#1a1b26,bold"
set -g mode-style "bg=#bb9af7,fg=#1a1b26,bold"
