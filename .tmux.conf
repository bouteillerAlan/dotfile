set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin "janoamaral/tokyo-night-tmux"

# set -g @tokyo-night-tmux_theme night
set -g @tokyo-night-tmux_theme moon   # night | storm | moon | day
set -g @tokyo-night-tmux_transparent 1 # transparent background

# start index from 1 and not from 0
set -g base-index 1

# vi/nvim-like copy mode
setw -g mode-keys vi

# reload conf
unbind r
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# pan navigation (in place of ctrl+b+arrow)
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# visual/yank
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel
bind-key -T copy-mode-vi C-v send -X rectangle-toggle

# line motions
bind-key -T copy-mode-vi 0 send -X start-of-line
bind-key -T copy-mode-vi ^ send -X back-to-indentation
bind-key -T copy-mode-vi '$' send -X end-of-line

# file/buffer motions
bind-key -T copy-mode-vi g send -X top-line
bind-key -T copy-mode-vi G send -X bottom-line

# search
bind-key -T copy-mode-vi / send -X search-forward
bind-key -T copy-mode-vi ? send -X search-backward
bind-key -T copy-mode-vi n send -X search-again
bind-key -T copy-mode-vi N send -X search-reverse

# form: no powerline arrows, plain glyphs only
# / | \ and braille (see ~/Documents/know/hermes-cli-statusbar.md)

# color just for reference
set -g @tokyo_bg "#1a1b26"
set -g @tokyo_bg_dark "#16161e"
set -g @tokyo_fg "#c0caf5"
set -g @tokyo_black "#414868"
set -g @tokyo_comment "#565f89"
set -g @tokyo_blue "#7aa2f7"
set -g @tokyo_cyan "#7dcfff"
set -g @tokyo_green "#9ece6a"
set -g @tokyo_magenta "#bb9af7"
set -g @tokyo_orange "#ff9e64"
set -g @tokyo_red "#f7768e"
set -g @tokyo_yellow "#e0af68"
set -g @tokyo_purple "#9d7cd8"
set -g @tokyo_teal "#73daca"

set -g status on
set -g status-interval 1
set -g status-justify left

set -g status-style "bg=#1a1b26,fg=#C0C0C0"
set -g status-left-length 100
set -g status-right-length 100

# background stays the original tokyo-night dark navy
set -g @hermes-bg          "#1a1b26"   # base background
set -g @hermes-text        "#C0C0C0"   # silver — inactive / body text
set -g @hermes-dim         "#8A7A4A"   # muted gold — separators, dim accents
set -g @hermes-gold        "#FFD700"   # gold — session name, active window
set -g @hermes-gold-hot    "#FFBF00"   # bright gold — hostname
set -g @hermes-cream       "#FFF8DC"   # cream — clock
set -g @hermes-good        "#8FBC8F"   # green — reserved (healthy status)
set -g @hermes-warn        "#FF8C00"   # orange — reserved (caution status)
set -g @hermes-critical    "#FF6B6B"   # red — reserved (danger status)

set -g status-left \
"#[fg=#{@hermes-gold},bg=#{@hermes-bg},bold] #S \
#[fg=#{@hermes-dim},bg=#{@hermes-bg}]/ "

# avoid to add another space beetwen each window
set -g window-status-separator ""

# Window index glyphs: 1-5 -> APL quads, fallback to number
set -g @win-glyph "#{?#{==:#I,1},⌸,#{?#{==:#I,2},⌹,#{?#{==:#I,3},⌺,#{?#{==:#I,4},⌻,#{?#{==:#I,5},⌼,#I}}}}}"

# Inactive windows
setw -g window-status-format \
"#[fg=#{@hermes-dim},bg=#{@hermes-bg}]|\
#[fg=#{@hermes-text},bg=#{@hermes-bg}] #{E:@win-glyph} #W "

# Active window
setw -g window-status-current-format \
"#[fg=#{@hermes-dim},bg=#{@hermes-bg}]|>\
#[fg=#{@hermes-gold},bg=#{@hermes-bg},bold] #{E:@win-glyph} #W \
#[fg=#{@hermes-dim},bg=#{@hermes-bg}]<"

# Right: hostname + time/date
set -g status-right \
"#[fg=#{@hermes-dim},bg=#{@hermes-bg}]⛬ \
#[fg=#{@hermes-gold-hot},bg=#{@hermes-bg},bold]#h \
#[fg=#{@hermes-dim},bg=#{@hermes-bg}]| \
#[fg=#{@hermes-cream},bg=#{@hermes-bg},bold]%H:%M\
#[fg=#{@hermes-dim},bg=#{@hermes-bg}] ⠶ \
#[fg=#{@hermes-text},bg=#{@hermes-bg}]%d-%b "

# Pane colors
set -g pane-border-style "fg=#{@hermes-dim}"
set -g pane-active-border-style "fg=#{@hermes-gold}"

# Messages
set -g message-style "bg=#{@hermes-gold},fg=#{@hermes-bg},bold"
set -g mode-style "bg=#{@hermes-gold-hot},fg=#{@hermes-bg},bold"
